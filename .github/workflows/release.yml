name: release

# Tag vX.Y.Z (matching package.json "version") -> GitHub Release with the Windows zip.
# Manual run (workflow_dispatch) -> zip as a workflow artifact, no release.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}"; exit 1
          fi

      - name: Fetch Windows binaries
        if: github.event_name != 'pull_request'
        run: npm run fetch-binaries

      - name: Package
        if: github.event_name != 'pull_request'
        run: npm run package

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: ugv-cams-win-x64
          path: release/*.zip

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release/*.zip
          generate_release_notes: true
